- name: add child domain to parent domain
  ansible.windows.win_powershell:
    script: |
      [CmdletBinding()]
      param (
          [String]
          $Password,

          [String]
          $DomainAdmin,

          [String]
          $ParentDomainName,

          [String]
          $NewDomainNetbiosName,

          [String]
          $ReplicationSourceDC,

          [String]
          $NewDomainName,

          [String]
          $DomSafePassword
      )
      # Any failure to read the domain (not found, or no AD Web Services answering yet) means
      # it doesn't exist from here: only a successful read skips the promotion.
      try {
          $child_domain = Get-ADDomain -Identity $NewDomainName -ErrorAction Stop
          $domainExist=$true
      } catch {
          $domainExist=$false
      }
      if (-not $domainExist) {
        $Ansible.Changed = $true
        $pass = ConvertTo-SecureString $Password -AsPlainText -Force
        $Cred = New-Object System.Management.Automation.PSCredential ($DomainAdmin, $pass)
        $safePassword = ConvertTo-SecureString $DomSafePassword -AsPlainText -Force
        # A failed earlier attempt leaves its database behind, which the next one refuses
        # ("the database has been replaced"): not a DC yet, so nothing there is in use.
        if ((Get-CimInstance Win32_ComputerSystem).DomainRole -lt 4) {
          foreach ($d in "C:\Windows\NTDS", "C:\Windows\SYSVOL") {
            if (Test-Path $d) { Remove-Item -Recurse -Force $d }
          }
          # Its transaction logs too (LogPath below), not the rest of C:\Windows\Logs.
          Remove-Item C:\Windows\Logs\edb*, C:\Windows\Logs\res*.jrs -Force -ErrorAction SilentlyContinue
        }
        $result = Install-ADDSDomain -Credential $Cred -SkipPreChecks -NewDomainName $NewDomainName -NewDomainNetbiosName $NewDomainNetbiosName -ParentDomainName $ParentDomainName -ReplicationSourceDC $ReplicationSourceDC -DatabasePath "C:\Windows\NTDS" -SYSVOLPath "C:\Windows\SYSVOL" -LogPath "C:\Windows\Logs" -SafeModeAdministratorPassword $safePassword -Force -NoRebootOnCompletion
        # Install-ADDSDomain reports a failed promotion in its result instead of throwing.
        if ($result.Status -ne "Success") { throw "child domain promotion failed: $($result.Message)" }
      } else {
        $Ansible.Changed = $false
      }
    parameters:
      Password: "{{parent_domain_password}}"
      DomSafePassword: "{{domain_password}}"
      DomainAdmin: "{{parent_domain_user}}"
      ParentDomainName: "{{parent_domain}}"
      ReplicationSourceDC: "{{source_dc}}"
      NewDomainNetbiosName: "{{netbios_name}}"
      NewDomainName: "{{domain.split('.')[0]}}"
  register: child_result

- name: Reboot
  win_reboot:
    reboot_timeout: 900
    post_reboot_delay: 100
  when: child_result.changed

