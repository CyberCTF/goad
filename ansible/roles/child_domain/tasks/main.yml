- name: "disable the registration of the {{nat_adapter}} interface (NAT address) in DNS"
  ansible.windows.win_shell: Get-NetAdapter '{{nat_adapter}}' | Set-DNSClient -RegisterThisConnectionsAddress $False
  when: two_adapters

- name: "Set configure dns to {{dns_domain}}"
  win_dns_client:
    adapter_names: "{{domain_adapter}}"
    ipv4_addresses:
      - "{{hostvars[dns_domain].ansible_host}}"
    log_path: C:\dns_log.txt

# The NAT adapter keeps the hypervisor's resolvers, which don't know the parent domain, and
# Windows may ask that adapter first: dcpromo then fails with 8524 (DNS lookup failure). Point
# it at the parent DC too: the domain is the lab's only DNS from then on.
- name: "point the {{nat_adapter}} interface's DNS at the parent DC"
  ansible.windows.win_dns_client:
    adapter_names: "{{nat_adapter}}"
    ipv4_addresses:
      - "{{hostvars[dns_domain].ansible_host}}"
  when: two_adapters

- name: flush the DNS cache
  ansible.windows.win_shell: Clear-DnsClientCache

- name: Install windows features - AD Domain Services
  win_feature:
    name: AD-Domain-Services
    state: present
    include_management_tools: yes
  register: features

- name: Install windows features - RSAT-ADDS
  win_feature:
    name: RSAT-ADDS
    state: present
    include_management_tools: yes
  register: features

