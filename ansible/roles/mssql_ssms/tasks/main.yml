# SSMS 20: the last version with the classic installer (aka.ms/ssmsfullsetup now serves SSMS 21,
# whose Visual Studio installer fails on Windows Server 2019 with 1603). Microsoft's permanent
# link to the SSMS 20 full installer; a file name of its own, so a cached SSMS 21 bootstrapper
# isn't reused.
- name: check SQL Server Manager Studio installer exists
  win_stat:
    path: c:\setup\mssql\SSMS20_installer.exe
  register: ssms_installer_file

- name: get the installer
  win_get_url:
      url: 'https://go.microsoft.com/fwlink/?linkid=2257624'
      dest: 'c:\setup\mssql\SSMS20_installer.exe'
  when: not ssms_installer_file.stat.exists

- name: check SSMS installation already done
  win_stat:
    path: "C:\\Program Files (x86)\\Microsoft SQL Server Management Studio 20"
  register: ssms_installation

- name: Install SSMS
  win_command: c:\setup\mssql\SSMS20_installer.exe /install /quiet /norestart
  register: install_ssmss
  # 3010: installed, a reboot is needed (done below).
  failed_when: install_ssmss.rc not in [0, 3010]
  when: not ssms_installation.stat.exists

- name: Reboot after install
  win_reboot:
    reboot_timeout: 600
  when: not ssms_installation.stat.exists
