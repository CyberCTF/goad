# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# GOAD (Game of Active Directory, by Orange Cyberdefense): two forests, three domains, five
# Windows servers. Isoloom builds the machines; GOAD's own playbooks build the lab from a
# controller. See https://www.isoloom.com
version: 1
name: goad

networks:
  lab: { cidr: 192.168.56.0/24 }

# Every box only sets up WinRM itself; GOAD's Ansible does the rest from the controller. Said
# once here (Windows Server 2019, 2 CPUs, 3 GB); a machine's own value wins.
common:
  os: windows-server@2019
  resources: { cpus: 2, memory_mb: 3000 }
  app:
    steps: [{ run: vagrant/ConfigureRemotingForAnsible.ps1 }]

groups:
  domain-controllers:
    members: [dc01, dc02, dc03]

machines:
  dc01:   # kingslanding: sevenkingdoms.local
    networks: { lab: 10 }
    ports: { dns: 53, kerberos: 88, ldap: 389, smb: 445 }

  dc02:   # winterfell: north.sevenkingdoms.local
    networks: { lab: 11 }
    ports: { dns: 53, kerberos: 88, ldap: 389, smb: 445 }

  dc03:   # meereen: essos.local
    os: windows-server@2016
    networks: { lab: 12 }
    ports: { dns: 53, kerberos: 88, ldap: 389, smb: 445 }

  srv02:  # castelblack: IIS and MSSQL in the north
    networks: { lab: 22 }
    ports: { iis: { port: 80, protocol: http }, mssql: 1433, smb: 445 }
    resources: { cpus: 2, memory_mb: 6000 }

  srv03:  # braavos: MSSQL and ADCS in essos
    os: windows-server@2016
    networks: { lab: 23 }
    ports: { http: { port: 80, protocol: http }, mssql: 1433, smb: 445 }
    resources: { cpus: 2, memory_mb: 5000 }

overrides:
  vagrant:
    machines:
      dc03:   # the box version GOAD uses for this one
        box: StefanScherer/windows_2016
        box_version: "2017.12.14"

provision:
  - ansible: ansible/main.yml
    requirements: ansible/requirements_311.yml
    # The lab's own per-host variables (which domain each machine belongs to) and the keyboard layouts.
    inventory: [ad/GOAD/data/inventory]
    # What each machine plays in the lab: the groups GOAD's playbooks target.
    groups:
      domain: [dc01, dc02, dc03, srv02, srv03]
      dc: [dc01, dc02, dc03]
      server: [srv02, srv03]
      parent_dc: [dc01, dc03]
      child_dc: [dc02]
      trust: [dc01, dc03]
      adcs: [dc01, srv03]
      adcs_customtemplates: [dc03]
      iis: [srv02]
      mssql: [srv02, srv03]
      mssql_ssms: [srv02]
      webdav: [srv02, srv03]
      laps_dc: [dc03]
      laps_server: [srv03]
      update: [srv02]
      no_update: [dc01, dc02, dc03, srv03]
      defender_on: [dc01, dc02, dc03, srv03]
      defender_off: [srv02]
    # The lab's settings, as GOAD's playbooks read them.
    vars:
      domain_name: GOAD
      admin_user: administrator
      add_route: 'no'
      route_gateway: 192.168.56.1
      route_network: 10.0.0.0/8
      enable_http_proxy: 'no'
      ad_http_proxy: 'http://{{proxy_ip}}:{{proxy_port}}'
      ad_https_proxy: 'http://{{proxy_ip}}:{{proxy_port}}'
      force_dns_server: 'no'
      dns_server: 1.1.1.1
      dns_server_forwarder: 1.1.1.1
      proxy_ip: 'x.x.x.x'
      proxy_port: '8080'

message: |
  GOAD is up: kingslanding {{ machines.dc01.addresses.lab }}, winterfell {{ machines.dc02.addresses.lab }},
  meereen {{ machines.dc03.addresses.lab }}, castelblack {{ machines.srv02.addresses.lab }} (IIS, MSSQL),
  braavos {{ machines.srv03.addresses.lab }} (MSSQL, ADCS). Three domains, two forests, one trust.
