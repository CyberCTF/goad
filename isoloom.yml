# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# GOAD (Game of Active Directory, by Orange Cyberdefense): two forests, three domains, five
# Windows servers. Isoloom builds the machines; GOAD's own playbooks build the lab from a
# controller. See https://www.isoloom.com
version: 1
name: goad

networks:
  lab: { cidr: 192.168.56.0/24 }

machines:
  dc01:   # kingslanding: sevenkingdoms.local
    networks: { lab: 10 }
    services: [{ port: 53, name: dns }, { port: 88, name: kerberos }, { port: 389, name: ldap }, { port: 445, name: smb }]
    resources: { cpus: 2, memory_mb: 3000 }
    vm:
      os: windows-server-2019
      provision: [vagrant/ConfigureRemotingForAnsible.ps1]

  dc02:   # winterfell: north.sevenkingdoms.local
    networks: { lab: 11 }
    services: [{ port: 53, name: dns }, { port: 88, name: kerberos }, { port: 389, name: ldap }, { port: 445, name: smb }]
    resources: { cpus: 2, memory_mb: 3000 }
    vm:
      os: windows-server-2019
      provision: [vagrant/ConfigureRemotingForAnsible.ps1]

  dc03:   # meereen: essos.local
    networks: { lab: 12 }
    services: [{ port: 53, name: dns }, { port: 88, name: kerberos }, { port: 389, name: ldap }, { port: 445, name: smb }]
    resources: { cpus: 2, memory_mb: 3000 }
    vm:
      os: windows-server-2016
      # The box version GOAD uses for this one.
      image:
        vagrant: StefanScherer/windows_2016
        vagrant_version: "2017.12.14"
      provision: [vagrant/ConfigureRemotingForAnsible.ps1]

  srv02:  # castelblack: IIS and MSSQL in the north
    networks: { lab: 22 }
    services: [{ port: 80, name: iis, http: true }, { port: 1433, name: mssql }, { port: 445, name: smb }]
    resources: { cpus: 2, memory_mb: 6000 }
    vm:
      os: windows-server-2019
      provision: [vagrant/ConfigureRemotingForAnsible.ps1]

  srv03:  # braavos: MSSQL and ADCS in essos
    networks: { lab: 23 }
    services: [{ port: 80, name: http, http: true }, { port: 1433, name: mssql }, { port: 445, name: smb }]
    resources: { cpus: 2, memory_mb: 5000 }
    vm:
      os: windows-server-2016
      provision: [vagrant/ConfigureRemotingForAnsible.ps1]

provision:
  - ansible: ansible/main.yml
    inventory:
      - ad/GOAD/data/inventory
      - ad/GOAD/providers/isoloom/inventory
      - globalsettings.ini
    requirements: ansible/requirements_311.yml
